[package]
name = "dao-v1"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "dao_v1"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.30.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

rust_decimal = { version = "=1.36.0", default-features = false, features = ["maths"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
solana-program = "=1.18.26"
fundraise = { path = "../fundraise" }
fee_share_trader_dao = { path = "../fee_share_trader_dao" }
hedgefun_curve = { path = "../hedgefun_curve" }
borsh = { version = "=0.10.3", features = ["const-generics"] }

spl-type-length-value = "=0.4.6"

spl-pod = "=0.2.5"

name: Verify recovered program
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_release.py
      - run: python scripts/security_tests.py
      - run: python scripts/test_variant.py binaries/dao_v1.deployed.so .build/differential
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: .build/
          include-hidden-files: true
